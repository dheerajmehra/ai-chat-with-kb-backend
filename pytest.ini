[pytest]
# Pytest configuration for ai-chat-with-kb-backend
# 
# NOTE: pytest-cov.ini mirrors this file - when updating common config
# (markers, testpaths, etc.), update BOTH files to keep them in sync.
# The only difference is the addopts line which adds coverage options.

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage options (only if pytest-cov is installed)
# To run without coverage: pytest (default - no coverage)
# To run with coverage enforcement: pytest -c pytest-cov.ini
# 
# Rationale for separate pytest-cov.ini:
# - Default pytest.ini runs fast without coverage overhead
# - pytest-cov.ini enables coverage measurement and enforces 70% threshold
# - This allows developers to run quick tests during development, and full coverage in CI/CD
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may require services or database)
    api: API endpoint tests (requires FastAPI test client)
    slow: Slow running tests (may take > 1 second)
    requires_vector_store: Tests that require vector store to be populated
    requires_openai: Tests that require OpenAI API key
    requires_azure: Tests that require Azure credentials
    mock: Tests that use mocks instead of real services

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:openai.*
    ignore::UserWarning:sentence_transformers.*

# Minimum Python version
minversion = 7.0
