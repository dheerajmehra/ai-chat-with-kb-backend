[pytest]
# ============================================================================
# IMPORTANT: This file mirrors pytest.ini - keep them in sync!
# The ONLY difference is the addopts line which adds coverage options.
# When updating common config (markers, testpaths, etc.), update BOTH files.
# ============================================================================
# Coverage-specific options (use with: pytest -c pytest-cov.ini)
# This enforces 70% minimum coverage and will fail if coverage drops below that threshold
# Includes coverage for shared, chat_service, and ingestion_service modules

# Test discovery patterns (MIRRORED FROM pytest.ini)
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths (MIRRORED FROM pytest.ini)
testpaths = tests

# Async support (MIRRORED FROM pytest.ini)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage-specific addopts (ONLY DIFFERENCE from pytest.ini)
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=shared
    --cov=chat_service
    --cov=ingestion_service
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
    --disable-warnings

# Markers for test categorization (MIRRORED FROM pytest.ini)
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may require services or database)
    api: API endpoint tests (requires FastAPI test client)
    slow: Slow running tests (may take > 1 second)
    requires_vector_store: Tests that require vector store to be populated
    requires_openai: Tests that require OpenAI API key
    requires_azure: Tests that require Azure credentials
    mock: Tests that use mocks instead of real services

# Logging (MIRRORED FROM pytest.ini)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings (MIRRORED FROM pytest.ini)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:openai.*
    ignore::UserWarning:sentence_transformers.*

# Minimum Python version (MIRRORED FROM pytest.ini)
minversion = 7.0
